- insert:
    - id: multi-agent-availability
      name: '@kiritoko1029/dsh-multi-agent/availability'
    - id: multi-agent-task-monitor
      name: '@kiritoko1029/dsh-multi-agent/task-monitor'
    - id: multi-agent-delegation-policy
      name: '@kiritoko1029/dsh-multi-agent/delegation-policy'
    - id: multi-agent-router
      name: '@kiritoko1029/dsh-multi-agent'
      config: {}
    - id: kimi-code-acp
      name: '@kiritoko1029/dsh-multi-agent/acp-provider'
      config:
        providerName: kimi-code
        command: !!js "ctx.get('multiAgentAvailability')?.kimiCommand"
        args: ['acp']
        permission: main-session
        subagentPermissionMode: auto
      inject: [multiAgentAvailability]
    - id: agy-acp
      name: '@kiritoko1029/dsh-multi-agent/agy-provider'
      config:
        providerName: agy
        command: !!js "ctx.get('multiAgentAvailability')?.agyCommand"
        args: ['acp']
        permission: main-session
        subagentPermissionMode: auto
      inject: [multiAgentAvailability]
    - id: codex-provider
      name: '@kiritoko1029/dsh-multi-agent/codex-provider'
      config:
        providerName: codex-router
        permissionPolicy: main-session
        subagentPermissionMode: auto
        permissionMode: approve-for-me
      inject: [multiAgentAvailability]
