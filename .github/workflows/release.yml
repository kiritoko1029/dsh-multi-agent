name: Release

# Pushing a v* tag builds the plugin TGZ and publishes it as a GitHub Release
# asset, with the release notes taken from the matching CHANGELOG.md section.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: npm run check

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Build client bundle
        run: npm run build

      - name: Build TGZ and SHA-256
        run: node scripts/build-release.mjs

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz dist/*.sha256 \
            --title "dsh-multi-agent $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
